version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major upgrades (e.g. TypeScript, Vitest) are done deliberately in their own PR,
    # since related packages have to move together.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
