name: Deploy smoke test

# Vercel reports each finished deployment (preview or production) to GitHub.
# This checks the deployed app is up and connected to its own database.
on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    name: Deploy smoke test
    # Only trust statuses Vercel itself posted: the bypass secret is sent to the reported URL.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.creator.login == 'vercel[bot]'
    runs-on: ubuntu-latest
    env:
      URL: ${{ github.event.deployment_status.environment_url }}
      # Lets automation through Vercel Authentication on protected previews.
      BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Check inputs
        run: |
          if [ -z "$BYPASS" ]; then
            echo "::error::Repository secret VERCEL_AUTOMATION_BYPASS_SECRET is not set."
            exit 1
          fi
          case "$URL" in
            https://*.vercel.app) ;;
            *) echo "::error::Refusing to send the bypass secret to unexpected URL: $URL"; exit 1 ;;
          esac
      - name: Health check reports the database is reachable
        run: |
          body=$(curl -sS --fail-with-body -H "x-vercel-protection-bypass: $BYPASS" "$URL/api/health")
          echo "$body"
          test "$(echo "$body" | jq -r .status)" = ok
          test "$(echo "$body" | jq -r .db)" = ok
      - name: Landing page carries security headers
        run: |
          headers=$(curl -sS -f -D - -o /dev/null -H "x-vercel-protection-bypass: $BYPASS" "$URL/")
          echo "$headers"
          echo "$headers" | grep -qi '^content-security-policy:'
          echo "$headers" | grep -qi '^strict-transport-security:'
          echo "$headers" | grep -qi '^x-frame-options: DENY'
      - name: Vercel Web Analytics script is served
        run: |
          curl -sS -f -o /dev/null -H "x-vercel-protection-bypass: $BYPASS" "$URL/_vercel/insights/script.js"
